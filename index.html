<style>
.hide{display:none!important}
body{font-family:'Figtree',sans-serif;color:#0F0F10}
h1,h2,h3,.head{font-family:'Oswald',sans-serif;letter-spacing:.01em}
.card{background:#fff;border:1px solid #E3DFD3;border-radius:14px}
.inp{width:100%;border:1px solid #CFC9B8;border-radius:8px;padding:.55rem .75rem;background:#fff}
.inp:focus,button:focus-visible,[tabindex]:focus-visible{outline:2px solid #C49A3A;outline-offset:2px}
.lbl{font-size:.8rem;font-weight:600;margin-bottom:.25rem;display:block;color:#47453d}
.btn{background:#0F0F10;color:#E6CD85;border-radius:8px;padding:.55rem 1rem;font-weight:600}
.btn:hover{background:#2b2b2e}
.gold{background:linear-gradient(135deg,#B8892E,#E6CD85 50%,#C49A3A);color:#0F0F10}
.chip{border:1px solid #CFC9B8;border-radius:999px;padding:.3rem .9rem;font-size:.85rem;background:#fff}
.chip.on{background:#0F0F10;color:#E6CD85;border-color:#0F0F10}
.nav{display:block;width:100%;text-align:left;padding:.6rem 1rem;border-radius:8px;color:#d8d3c4;font-weight:500}
.nav:hover{background:rgba(255,255,255,.08)}
.nav.on{background:linear-gradient(135deg,#B8892E,#E6CD85 50%,#C49A3A);color:#0F0F10;font-weight:700}
.badge{font-size:.72rem;font-weight:700;padding:.15rem .6rem;border-radius:999px;white-space:nowrap}
.open{cursor:pointer;transition:box-shadow .15s,border-color .15s}.open:hover{border-color:#C49A3A;box-shadow:0 4px 18px rgba(196,154,58,.25)}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .25s ease}@keyframes pop{from{transform:scale(.97);opacity:0}}}

<body class="bg-paper min-h-screen">

<!-- LOGIN -->
<section id="login" class="min-h-screen grid md:grid-cols-2">
  <div class="bg-ink text-white p-8 md:p-14 flex flex-col justify-center items-center text-center gap-6" style="background:radial-gradient(circle at 50% 35%,#2a2418 0,#0F0F10 65%)">
    <img class="logo w-52 h-52 md:w-72 md:h-72 rounded-full object-cover" style="box-shadow:0 0 70px rgba(196,154,58,.45)" alt="Logo de San Táchira de Nelson Zambrano">
    <h1 class="text-3xl md:text-4xl font-bold text-gold2">Sistema de cobranzas</h1>
    <p class="text-white/70 max-w-sm">Controla tu capital en la calle, tus cobros del día y tu mora en un solo lugar.</p>
  </div>
  <div class="p-8 md:p-14 flex flex-col justify-center">
    <form id="loginForm" class="card p-6 max-w-sm w-full mx-auto space-y-4" autocomplete="off">
      <h2 class="text-2xl font-bold">Iniciar sesión</h2>
      <div><label class="lbl" for="u">Usuario</label><input id="u" class="inp" required></div>
      <div><label class="lbl" for="p">Clave</label><input id="p" type="password" class="inp" required></div>
      <p id="loginErr" class="text-mora text-sm hidden">Usuario o clave incorrectos.</p>
      <button class="btn gold w-full">Entrar</button>
      <p class="text-xs text-slate-600 border-t pt-3">Los usuarios los crea únicamente el administrador. No hay registro público.<br><span class="text-slate-500">Demo: <b>admin</b> / <b>1234</b></span></p>
    </form>
  </div>
</section>

<!-- APP -->
<div id="app" class="hide md:flex min-h-screen">
  <aside class="hidden md:flex w-64 shrink-0 bg-ink text-white flex-col p-4 sticky top-0 h-screen">
    <div class="px-2 py-3 mb-4 flex items-center gap-3 border-b border-white/10"><img class="logo w-14 h-14 rounded-full object-cover shrink-0" alt="Logo San Táchira"><div><p class="head font-bold text-lg leading-tight text-gold2">San Táchira</p><p class="text-xs text-white/60">de Nelson Zambrano</p></div></div>
    <nav id="navD" class="space-y-1"></nav>
    <div class="mt-auto space-y-2 text-xs">
      <button id="resetD" class="text-white/40 hover:text-white/80 underline px-2">Resetear datos de demo</button>
      <button id="outD" class="block text-white/70 hover:text-white px-2">Cerrar sesión</button>
    </div>
  </aside>
  <div class="flex-1 min-w-0 flex flex-col">
    <header class="md:hidden bg-ink text-white px-4 py-2 flex justify-between items-center">
      <span class="flex items-center gap-2"><img class="logo w-9 h-9 rounded-full object-cover" alt="Logo San Táchira"><span class="head font-bold text-gold2">San Táchira</span></span>
      <span class="text-xs space-x-3"><button id="resetM" class="text-white/50 underline">Resetear demo</button><button id="outM">Salir</button></span>

    <main id="view" class="p-4 md:p-8 flex-1 pb-24 md:pb-8"></main>
  </div>
  <nav id="navM" class="md:hidden fixed bottom-0 inset-x-0 bg-ink grid grid-cols-4 gap-1 p-1.5"></nav>
</div>

const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/864e5);
const money=n=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fdate=s=>new Date(s+'T12:00:00').toLocaleDateString('es-PA',{day:'2-digit',month:'short',year:'numeric'});
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);

/* ---------- Datos (sin intereses ni ganancias) ---------- */
function mkLoan(cuota,cada,n,start,pagadas){
  return {cuota,cada,n,cuotas:Array.from({length:n},(_,i)=>{const f=addDays(start,cada*i),p=i<pagadas;
    return {n:i+1,fecha:f,monto:cuota,pagada:p,recargo:0,fechaPago:p?f:null,cobrado:p?cuota:0}})};
}
function seed(){const t=today();
  return {clientes:[
    ['María Fernández','8-765-1234','6677-1020','Calle 50, Bella Vista',mkLoan(50,7,12,addDays(t,-42),2)],
    ['Juan Pérez','4-221-908','6210-4455','Vía Tocumen, Las Mañanitas',mkLoan(30,7,50,addDays(t,-21),1)],
    ['Carmen Rojas','8-512-3345','6988-7712','San Miguelito, Mano de Piedra',mkLoan(25,3,20,addDays(t,-9),4)],
    ['Luis Contreras','PE-14-2290','6455-1809','Calidonia, Av. Perú',mkLoan(15,7,10,addDays(t,-3),0)]
  ].map((c,i)=>({id:i+1,nombre:c[0],cedula:c[1],tel:c[2],dir:c[3],prestamo:c[4]}))};
}
let db;
const save=()=>LS.set(K,JSON.stringify(db));
function load(){try{db=JSON.parse(LS.get(K))}catch(e){db=null}if(!db||!db.clientes){db=seed();save()}}

/* ---------- Regla de mora: $5 por semana de atraso en cada cuota vencida ---------- */
const RECARGO=5;
const diasAtraso=q=>q.pagada?0:Math.max(0,diff(today(),q.fecha));
const semanas=d=>Math.ceil(d/7);
const vencida=q=>diasAtraso(q)>0;
const recargo=q=>q.pagada?q.recargo:RECARGO*semanas(diasAtraso(q));
const total=q=>q.pagada?q.cobrado:q.monto+recargo(q);
const pendientes=c=>c.prestamo.cuotas.filter(q=>!q.pagada);
const esMoroso=c=>pendientes(c).some(vencida);
const pagos=()=>db.clientes.flatMap(c=>c.prestamo.cuotas.filter(q=>q.pagada).map(q=>({c,q})));
function pagar(cid,n){const q=db.clientes.find(c=>c.id==cid).prestamo.cuotas.find(x=>x.n==n);
  q.recargo=recargo(q);q.cobrado=q.monto+q.recargo;q.pagada=true;q.fechaPago=today();save()}

function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.add('hidden'),2600)}
function ask(html,ok){$('#mbox').innerHTML=html+`<div class="flex gap-2 mt-5"><button id="mNo" class="chip flex-1 py-2">Cancelar</button><button id="mOk" class="btn gold flex-1">Confirmar</button></div>`;
  $('#modal').classList.remove('hide');$('#mNo').onclick=()=>$('#modal').classList.add('hide');
  $('#mOk').onclick=()=>{$('#modal').classList.add('hide');ok()};$('#mOk').focus()}
function renderNav(){const h=[['',' '],['m',' text-center text-sm']].map(([,x])=>NAV.map(([k,l])=>`<button data-v="${k}" class="nav${x} ${view==k?'on':''}">${l}</button>`).join(''));
  $('#navD').innerHTML=h[0];$('#navM').innerHTML=h[1]}
function go(v,keep){view=v;if(!keep)cid=null;renderNav();render();window.scrollTo(0,0)}
function openCliente(id){cid=id;go('clientes',true)}
document.addEventListener('click',e=>{
  const v=e.target.closest('[data-v]');if(v)return go(v.dataset.v);
  const o=e.target.closest('[data-open]');if(o)return openCliente(+o.dataset.open);
  const p=e.target.closest('[data-pay]');if(p){const [id,n]=p.dataset.pay.split(':').map(Number);
    const c=db.clientes.find(x=>x.id==id),x=c.prestamo.cuotas.find(z=>z.n==n);
    ask(`<h3 class="text-xl font-bold">Registrar pago</h3><p class="mt-2">${esc(c.nombre)} · cuota ${n}</p><p class="head text-3xl font-bold mt-1">${money(total(x))}</p>${recargo(x)?`<p class="text-sm text-mora">Incluye ${money(recargo(x))} de recargo por mora.</p>`:''}`,
      ()=>{pagar(id,n);toast('Pago registrado');render()})}
});

const title=(t,s)=>`<div class="mb-6"><h2 class="text-4xl font-bold">${t}</h2><div class="h-1 w-16 gold rounded mt-2"></div><p class="text-slate-600 mt-3">${s}</p></div>`;

function qcard(c,x,nm){const m=vencida(x),rec=recargo(x),sem=x.pagada?rec/RECARGO:semanas(diasAtraso(x));
  return `<article class="card p-4 pop ${m?'border-mora border-2':''}">

   <p class="mt-2 text-sm">${x.pagada?`Pagada el <b>${fdate(x.fechaPago)}</b> · vencía ${fdate(x.fecha)}`:`Fecha de pago: <b>${fdate(x.fecha)}</b>`}</p>

   ${x.pagada?'':`<button class="btn gold text-sm" data-pay="${c.id}:${x.n}">Registrar pago</button>`}</div></article>`}

/* ---------- Dashboard ---------- */
function dash(){
  const pend=db.clientes.flatMap(c=>pendientes(c).map(x=>({c,x}))),t=today();
  const hoy=pend.filter(i=>i.x.fecha===t),venc=pend.filter(i=>vencida(i.x));
  const cobHoy=sum(pagos().filter(i=>i.q.fechaPago===t),i=>i.q.cobrado);
  $('#view').innerHTML=title('Dashboard','Resumen de tu cartera al '+fdate(t))+`
  <div class="grid sm:grid-cols-2 xl:grid-cols-4 gap-4">
   ${stat('Capital en calle',money(sum(pend,i=>i.x.monto)),'Cuotas pendientes por cobrar')}
   ${stat('Cobros del día',money(sum(hoy,i=>total(i.x))),hoy.length+' cuotas vencen hoy · cobrado hoy '+money(cobHoy))}
   ${stat('Mora acumulada',money(sum(venc,i=>recargo(i.x))),venc.length+' cuotas atrasadas (solo recargos)','text-mora')}
   ${stat('Clientes en mora',db.clientes.filter(esMoroso).length,'de '+db.clientes.length+' clientes activos')}
  </div>
  <h3 class="text-2xl font-bold mt-8 mb-3">Clientes en mora</h3>
  <div class="grid md:grid-cols-2 xl:grid-cols-3 gap-4">${db.clientes.filter(esMoroso).map(c=>{const v=pendientes(c).filter(vencida);
    return `<div tabindex="0" data-open="${c.id}" class="card open p-4 border-l-4 border-l-mora"><p class="font-bold">${esc(c.nombre)}</p><p class="text-sm text-slate-600">${v.length} cuota(s) atrasada(s) · hasta ${Math.max(...v.map(diasAtraso))} días</p><p class="head text-2xl font-bold text-mora mt-2">${money(sum(v,total))}</p></div>`}).join('')||'<p class="text-slate-600">Sin clientes morosos hoy.</p>'}</div>`;
}

  const dias=Array.from({length:7},(_,i)=>addDays(t,i-6)).map(f=>({f,v:sum(P.filter(i=>i.q.fechaPago===f),i=>i.q.cobrado)}));
  const mx=Math.max(1,...dias.map(d=>d.v)),mes=sum(P.filter(i=>i.q.fechaPago.slice(0,7)===t.slice(0,7)),i=>i.q.cobrado);
  const falta=sum(db.clientes.flatMap(c=>pendientes(c)).filter(x=>x.fecha===t),total);
  $('#view').innerHTML=title('Caja','Dinero cobrado. Los pagos se registran desde Cobros.')+`
  <div class="grid lg:grid-cols-3 gap-4">
   <div class="lg:col-span-2 rounded-2xl p-6 text-white bg-ink border-b-4 border-gold" style="background:radial-gradient(circle at 85% 20%,#3a2f17 0,#0F0F10 60%)">
    <p class="text-white/70">Cobrado hoy</p><p class="head text-6xl font-bold text-gold2 mt-1">${money(sum(hoy,i=>i.q.cobrado))}</p>
    <p class="text-white/70 mt-2">${hoy.length} pago(s) recibido(s) · incluye ${money(sum(hoy,i=>i.q.recargo))} en recargos por mora</p></div>
   <div class="grid gap-4">${stat('Últimos 7 días',money(sum(dias,d=>d.v)),'incluye hoy')}${stat('Este mes',money(mes),'cobrado desde el día 1')}</div>
  </div>
  <p class="text-sm text-slate-600 mt-3">Aún por cobrar de las cuotas que vencen hoy: <b>${money(falta)}</b></p>
  <h3 class="text-2xl font-bold mt-6 mb-3">Cobrado por día</h3>
  <div class="grid grid-cols-7 gap-2">${dias.map(d=>`<div class="card p-2 text-center"><div class="h-24 flex items-end"><div class="w-full rounded-t gold" style="height:${d.v/mx*100}%;min-height:${d.v?4:0}px"></div></div><p class="head font-bold text-sm mt-1">${money(d.v).replace('.00','')}</p><p class="text-[11px] text-slate-500">${new Date(d.f+'T12:00:00').toLocaleDateString('es-PA',{weekday:'short',day:'numeric'})}</p></div>`).join('')}</div>
  <h3 class="text-2xl font-bold mt-8 mb-3">Pagos recibidos hoy</h3>
  <div class="grid md:grid-cols-2 xl:grid-cols-3 gap-3">${hoy.map(i=>`<div class="card p-4 flex justify-between items-center"><div><button data-open="${i.c.id}" class="font-bold hover:underline">${esc(i.c.nombre)}</button><p class="text-xs text-slate-500">Cuota ${i.q.n} de ${i.c.prestamo.n}${i.q.recargo?' · con recargo '+money(i.q.recargo):''}</p></div><p class="head text-2xl font-bold text-ok">${money(i.q.cobrado)}</p></div>`).join('')||'<p class="text-slate-600">Todavía no hay pagos hoy.</p>'}</div>`;
}

/* ---------- Clientes ---------- */
function clientes(){
  if(cid)return detalle();
  const tabs=`<div class="flex gap-2 mb-5"><button class="chip ${tab=='registro'?'on':''}" data-t="registro">Registrar cliente</button><button class="chip ${tab=='consulta'?'on':''}" data-t="consulta">Consultar clientes</button></div>`;
  $('#view').innerHTML=title('Clientes','Registra clientes nuevos o consulta su plan de pagos.')+tabs+'<div id="tabBody"></div>';
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;clientes()});
  tab=='registro'?formCliente():consulta();
}
function formCliente(){
  $('#tabBody').innerHTML=`<form id="fCli" class="card p-5 grid md:grid-cols-2 gap-4 max-w-3xl">
   <div><label class="lbl" for="nNom">Nombre completo</label><input id="nNom" class="inp" required></div>
   <div><label class="lbl" for="nCed">Cédula</label><input id="nCed" class="inp" required></div>
   <div><label class="lbl" for="nTel">Teléfono</label><input id="nTel" class="inp" required></div>
   <div><label class="lbl" for="nDir">Dirección</label><input id="nDir" class="inp" required></div>
   <div class="md:col-span-2 border-t pt-4"><h3 class="text-xl font-bold">Plan de pagos</h3></div>
   <div><label class="lbl" for="nMon">Monto de la cuota ($)</label><input id="nMon" type="number" min="1" step="0.01" class="inp" required></div>
   <div><label class="lbl" for="nDia">Paga cada cuántos días</label><input id="nDia" type="number" min="1" max="90" value="7" class="inp" required></div>
   <div><label class="lbl" for="nCuo">Total de cuotas</label><input id="nCuo" type="number" min="1" max="200" class="inp" required></div>
   <div><label class="lbl" for="nFec">Fecha de la primera cuota</label><input id="nFec" type="date" value="${addDays(today(),7)}" class="inp" required></div>
   <p id="prev" class="md:col-span-2 bg-paper border border-gold/40 rounded-lg p-3"></p>
   <button class="btn gold md:col-span-2">Registrar cliente</button></form>`;
  const prev=()=>{const m=+$('#nMon').value||0,d=+$('#nDia').value||0,n=+$('#nCuo').value||0,nom=$('#nNom').value.trim()||'El cliente';
    $('#prev').innerHTML=`${esc(nom)} pagará <b>${money(m)}</b> cada <b>${d} días</b> en <b>${n} cuotas</b>. Total a pagar: <b class="head text-xl">${money(m*n)}</b>`};
  ['nNom','nMon','nDia','nCuo'].forEach(i=>$('#'+i).oninput=prev);prev();
  $('#fCli').onsubmit=e=>{e.preventDefault();const id=Math.max(0,...db.clientes.map(c=>c.id))+1;
    db.clientes.push({id,nombre:$('#nNom').value.trim(),cedula:$('#nCed').value.trim(),tel:$('#nTel').value.trim(),dir:$('#nDir').value.trim(),
      prestamo:mkLoan(+$('#nMon').value,+$('#nDia').value,+$('#nCuo').value,$('#nFec').value,0)});
    save();tab='consulta';q='';toast('Cliente registrado');clientes()};
}
function consulta(){
  $('#tabBody').innerHTML=`<input id="busq" class="inp max-w-md mb-5" placeholder="Buscar por nombre, cédula o teléfono" value="${esc(q)}" aria-label="Buscar cliente"><div id="lista" class="grid md:grid-cols-2 xl:grid-cols-3 gap-4"></div>`;
  const draw=()=>{const t=q.toLowerCase();
    $('#lista').innerHTML=db.clientes.filter(c=>[c.nombre,c.cedula,c.tel].some(x=>x.toLowerCase().includes(t))).map(c=>{const p=c.prestamo,pg=p.cuotas.filter(x=>x.pagada).length;
      return `<div tabindex="0" data-open="${c.id}" class="card open p-4"><div class="flex justify-between items-start gap-2"><div><p class="font-bold text-lg">${esc(c.nombre)}</p><p class="text-sm text-slate-600">${esc(c.cedula)} · ${esc(c.tel)}</p></div>${esMoroso(c)?'<span class="badge bg-mora text-white">Moroso</span>':'<span class="badge bg-green-100 text-ok">Al día</span>'}</div>
      <div class="mt-3 h-2 bg-paper rounded-full overflow-hidden border border-slate-200"><div class="h-full gold" style="width:${pg/p.n*100}%"></div></div>
      <p class="text-xs text-slate-600 mt-1">${pg} de ${p.n} cuotas pagadas · ${money(p.cuota)} cada ${p.cada} días</p>
      <p class="mt-2 text-sm">Pendiente: <b class="head text-lg">${money(sum(pendientes(c),x=>x.monto))}</b></p><p class="text-xs text-gold font-semibold mt-1">Ver todas las cuotas</p></div>`}).join('')||'<p class="text-slate-600">No hay clientes que coincidan con la búsqueda.</p>'};
  $('#busq').oninput=e=>{q=e.target.value;draw()};draw();
}
function detalle(){
  const c=db.clientes.find(x=>x.id==cid),p=c.prestamo,pen=pendientes(c),atr=pen.filter(vencida),pag=p.cuotas.filter(x=>x.pagada);
  const F={todas:()=>true,pagadas:x=>x.pagada,atrasadas:vencida,porpagar:x=>!x.pagada&&!vencida(x)};
  const chips=[['todas','Todas'],['pagadas','Pagadas'],['atrasadas','Atrasadas'],['porpagar','Por pagar']].map(([k,l])=>`<button class="chip ${dfil==k?'on':''}" data-d="${k}">${l}</button>`).join('');
  $('#view').innerHTML=`<button class="chip mb-4" data-v="clientes">← Volver a clientes</button>
  <div class="card p-5 mb-4 border-t-4 border-t-gold flex flex-wrap justify-between gap-3"><div><h2 class="text-4xl font-bold">${esc(c.nombre)}</h2><p class="text-slate-600">${esc(c.cedula)} · ${esc(c.tel)} · ${esc(c.dir)}</p></div>${esMoroso(c)?'<span class="badge bg-mora text-white self-start">Moroso</span>':'<span class="badge bg-green-100 text-ok self-start">Al día</span>'}</div>
  <div class="grid sm:grid-cols-2 xl:grid-cols-4 gap-4">
   ${stat('Plan de pagos',money(p.cuota*p.n),p.n+' cuotas de '+money(p.cuota)+' cada '+p.cada+' días')}
   ${stat('Pagado',money(sum(pag,x=>x.cobrado)),pag.length+' cuotas pagadas')}
   ${stat('Pendiente',money(sum(pen,x=>x.monto)),pen.length+' cuotas por pagar')}
   ${stat('Atrasado con recargo',money(sum(atr,total)),atr.length+' cuotas atrasadas · '+money(sum(atr,recargo))+' de recargo',atr.length?'text-mora':'')}
  </div>
  <div class="flex flex-wrap gap-2 my-5">${chips}</div>
  <div class="grid md:grid-cols-2 xl:grid-cols-3 gap-4">${p.cuotas.filter(F[dfil]).map(x=>qcard(c,x,false)).join('')||'<p class="text-slate-600">No hay cuotas en esta categoría.</p>'}</div>`;
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{dfil=b.dataset.d;detalle()});
}

/* ---------- Cobros ---------- */
function cobros(){
  let items=[];
  db.clientes.forEach(c=>{const p=pendientes(c),prox=p.find(x=>!vencida(x));[...p.filter(vencida),...(prox?[prox]:[])].forEach(x=>items.push({c,x}))});
  const F={todos:()=>true,morosos:i=>vencida(i.x),hoy:i=>i.x.fecha===today(),proximos:i=>i.x.fecha>today()};
  items=items.filter(F[filtro]).sort((a,b)=>a.x.fecha.localeCompare(b.x.fecha));
  const chips=[['todos','Todos'],['morosos','Morosos'],['hoy','Vencen hoy'],['proximos','Próximos']].map(([k,l])=>`<button class="chip ${filtro==k?'on':''}" data-f="${k}">${l}</button>`).join('');
  $('#view').innerHTML=title('Cobros','Cuotas pendientes por cliente. Cada semana de atraso suma $5 a la cuota vencida.')+`<div class="flex flex-wrap gap-2 mb-5">${chips}</div>
  <div class="grid md:grid-cols-2 xl:grid-cols-3 gap-4">${items.map(i=>qcard(i.c,i.x,true)).join('')||'<p class="text-slate-600">No hay cuotas en esta categoría.</p>'}</div>`;
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filtro=b.dataset.f;cobros()});
}

if(SS.get('auth'))showApp();
</script>
</body>
</html>
